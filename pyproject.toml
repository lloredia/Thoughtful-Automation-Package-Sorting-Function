[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "package-sorter"
version = "1.0.0"
description = "Classify packages into dispatch stacks from dimensions and mass."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lesley Oredia" }]
keywords = ["dispatch", "packages", "sorting"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.15",
  "pre-commit>=4",
  "pytest>=8.3",
  "pytest-cov>=6",
  "ruff>=0.11",
]

[project.scripts]
package-sorter = "package_sorter.cli:main"

[project.urls]
Homepage = "https://github.com/lloredia/Thoughtful-Automation-Package-Sorting-Function"
Repository = "https://github.com/lloredia/Thoughtful-Automation-Package-Sorting-Function"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
package_sorter = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "--cov=package_sorter",
  "--cov-report=term-missing",
  "--cov-fail-under=100",
]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["package_sorter"]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = []

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "ANN",
  "B",
  "C4",
  "D",
  "E",
  "F",
  "I",
  "N",
  "PIE",
  "PT",
  "RET",
  "RUF",
  "SIM",
  "UP",
  "W",
]
ignore = [
  "ANN401",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
packages = ["package_sorter"]
mypy_path = "src"
explicit_package_bases = true
